name: Verify common foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and obfuscated executable JAR
        run: ./gradlew test bootJarObfuscate --no-daemon
      - name: Deployment script checks
        run: bash scripts/tests/deployment-scripts.sh
      - name: Run obfuscated image with PostgreSQL and Redis
        run: bash scripts/tests/obfuscated-smoke.sh
