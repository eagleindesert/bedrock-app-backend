name: bedrock

services:
  postgres:
    image: postgres:17-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bedrock}
      POSTGRES_USER: ${DB_USERNAME:-bedrock}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: [redis-server, --requirepass, '${REDIS_PASSWORD}', --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  be:
    image: eagleindesert/${BE_IMAGE_REPO:-bedrock-app-backend}:${IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${BE_HOST_PORT:-8080}:8080'
    env_file:
      - .env
    volumes:
      - be_logs:/app/logs
    environment:
      PORT: 8080
      LOG_DIR: /app/logs
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bedrock}
      DB_USERNAME: ${DB_USERNAME:-bedrock}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}

volumes:
  postgres_data:
  redis_data:
  be_logs:
