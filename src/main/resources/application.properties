spring.application.name=app

spring.config.import=optional:file:.env[.properties]

# Docker Compose Configuration
spring.docker.compose.file=compose-dev.yaml

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bedrock_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway (DB 스키마 변경은 전부 src/main/resources/db/migration 을 통해서만 한다)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# ddl-auto=update 로 이미 만들어져 있던 DB는 V1을 건너뛰고 V2부터 적용한다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=hibernate ddl-auto baseline

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Session Configuration
server.servlet.session.timeout=1800s

# Session Cookie Configuration
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true

logging.level.org.springframework.security.web=${LOG_LEVEL_SECURITY:INFO}

# Swagger / OpenAPI
# 운영 배포 시 SWAGGER_ENABLED=false 로 문서와 UI를 모두 비활성화
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.packages-to-scan=com.bedrock.app