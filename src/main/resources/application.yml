spring:
  application:
    name: bedrock-api
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
      file: docker-compose.yaml
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:${DB_NAME:bedrock}}}
    username: ${DB_USERNAME:${DB_USER:bedrock}}
    password: ${DB_PASSWORD:bedrock}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: true
    validate-on-migrate: true
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  session:
    timeout: 30m
    data:
      redis:
        namespace: bedrock:session:v2
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  mvc:
    log-request-details: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        name: BEDROCK_SESSION
        path: /
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

bedrock:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  security:
    argon2:
      memory-kb: 19456
      iterations: 2
      parallelism: 1
  kms:
    key-id: ${KMS_KEY_ID:local-dev-kms-key}
  mail:
    from-address: ${MAIL_FROM:no-reply@example.com}
    hourly-global-limit: ${MAIL_HOURLY_LIMIT:5000}
  ai:
    timeout-ms: ${AI_TIMEOUT_MS:15000}
    daily-user-limit: ${AI_DAILY_USER_LIMIT:100}
  ocr:
    timeout-ms: ${OCR_TIMEOUT_MS:20000}
    daily-user-limit: ${OCR_DAILY_USER_LIMIT:20}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  packages-to-scan: com.bedrock.app

# 예외 SQL/바인딩 값, 헤더, 본문을 프레임워크 로그로 노출하지 않는다.
logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.hibernate.orm.jdbc.error: OFF
    org.springframework.web: WARN
    org.springframework.security: WARN
