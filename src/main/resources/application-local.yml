# bootRun의 기본 프로필. 실제 자격 증명을 저장소 설정에 복사하지 않는다.
spring:
  config:
    import: optional:file:${BEDROCK_ENV_FILE:.env}[.properties]
  data:
    redis:
      password: ${REDIS_PASSWORD:bedrock}

server:
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:false}

# 로컬 개발에서는 API 문서를 연다. 기반 설정의 기본값은 닫힘이다.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
